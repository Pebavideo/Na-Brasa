<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Na Brasa — Comandas</title>
    <meta
      name="description"
      content="Gestão completa e ágil para espetinhos, bares e restaurantes."
    />

    <!-- PWA / Atalho no celular -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ff6600" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Na Brasa" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Compartilhamento (Facebook, WhatsApp) -->
    <meta property="og:title" content="Na Brasa - Sistema de Mesas e Comandas" />
    <meta
      property="og:description"
      content="Gestão completa e ágil para espetinhos, bares e restaurantes."
    />
    <meta property="og:image" content="https://na-brasa-ff2e0.web.app/og-image.jpg" />
    <meta property="og:url" content="https://na-brasa-ff2e0.web.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card (usa os mesmos metadados do Open Graph) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Na Brasa - Sistema de Mesas e Comandas" />
    <meta
      name="twitter:description"
      content="Gestão completa e ágil para espetinhos, bares e restaurantes."
    />
    <meta name="twitter:image" content="https://na-brasa-ff2e0.web.app/og-image.jpg" />
